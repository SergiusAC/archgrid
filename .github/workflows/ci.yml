name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # The wrapper JAR is committed; verifying its checksum against Gradle's published
          # list is what stops a tampered wrapper from executing arbitrary code in CI.
          validate-wrappers: true
          build-root-directory: server

      # Integration tests use Testcontainers. GitHub-hosted Ubuntu runners provide a Docker
      # daemon, so dev.archgrid.support.Docker#isAvailable is true and nothing is skipped.
      - name: Build and test
        working-directory: server
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: server-test-results
          path: server/**/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  # The browser checks. They exist because a whole class of defect in this product is invisible to
  # tsc, to the linter and to the server's tests — arrows that do not render, a panel that will not
  # collapse, a saved view that reopens as it was before the save. Every check here stands for one
  # that shipped.
  #
  # Only on pull requests and on main: the job brings up Postgres, Keycloak, the server and the
  # bundle, and takes several minutes. Running it on every push to every branch would buy nothing
  # the author cannot get by running the driver locally.
  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          build-root-directory: server

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Start Postgres and Keycloak
        run: docker compose -f deploy/docker-compose.yml up -d --wait

      - name: Build the server
        working-directory: server
        run: ./gradlew bootJar --no-daemon

      - name: Start the server
        working-directory: server
        run: |
          nohup java -jar archgrid-app/build/libs/*.jar > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          echo "server did not become healthy"; tail -50 "$RUNNER_TEMP/server.log"; exit 1

      # The workspace API is read-only until phase 2's admin surface lands, so the first row goes
      # in by hand — the same line README gives a developer.
      - name: Seed a workspace
        run: |
          docker compose -f deploy/docker-compose.yml exec -T postgres             psql -U archgrid -d archgrid -c             "insert into workspace (id, \"key\", name) values (gen_random_uuid(), 'default', 'Default workspace')"

      - name: Install the web dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Serve the bundle
        working-directory: web
        run: |
          npm run build
          nohup npx vite preview --port 5173 --strictPort > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "the bundle is not being served"; tail -30 "$RUNNER_TEMP/web.log"; exit 1

      - name: Smoke
        working-directory: web
        run: node ../.claude/skills/run-archgrid/driver.mjs smoke

      - name: Interactions
        working-directory: web
        run: node ../.claude/skills/run-archgrid/driver.mjs interactions

      # Screenshots are the point of the exercise: a passing count is not the same as a diagram
      # that reads correctly, and a failure leaves `failure.png` showing what the browser saw.
      - name: Publish screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-screenshots
          path: web/build/ui-check/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Server log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/server.log" || true
