spring:
  application:
    name: archgrid

  threads:
    virtual:
      enabled: true

  datasource:
    # Port 5433 matches deploy/docker-compose.yml, which avoids 5432 because a developer
    # machine usually already has something there. Always set explicitly in production.
    url: ${ARCHGRID_DB_URL:jdbc:postgresql://localhost:5433/archgrid}
    username: ${ARCHGRID_DB_USER:archgrid}
    password: ${ARCHGRID_DB_PASSWORD:archgrid}
    hikari:
      pool-name: archgrid-pool
      maximum-pool-size: ${ARCHGRID_DB_POOL_MAX:16}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Never enabled. An on-premise upgrade must be forward-only and reversible by restoring
    # a backup, never by a tool silently rewriting a customer's schema.
    clean-disabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ARCHGRID_OIDC_ISSUER:http://localhost:8081/realms/archgrid}

server:
  port: ${ARCHGRID_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

archgrid:
  security:
    # Dotted paths into the JWT claim set that hold role or group membership.
    # Keycloak: realm_access.roles. Entra ID: roles. Generic OIDC: groups.
    role-claim-paths:
      - realm_access.roles
      - roles
      - groups
    authority-prefix: ROLE_

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    dev.archgrid: ${ARCHGRID_LOG_LEVEL:INFO}

---
# Production profile: JSON logs so the customer can ship them to whatever they already run.
spring:
  config:
    activate:
      on-profile: prod

logging:
  structured:
    format:
      console: ecs
